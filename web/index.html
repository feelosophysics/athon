<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개념 시각화 추천</title>
  <link rel="stylesheet" href="style.css">
  <script src="pyapi.js"></script>
</head>
<body>
  <header>
    <h1>개념 시각화 추천</h1>
    <a href="compare.html" class="nav">두 학습자 비교</a>
    <div id="health" class="health"></div>
  </header>

  <section id="setup" class="panel">
    <h2>평가 준비</h2>
    <label>피평가자 이름(이 기기에서 기록을 찾는 데만 쓴다)
      <input id="learner" type="text" maxlength="40" placeholder="예: 학습자A">
    </label>
    <details>
      <summary>지난 동료 평가 피드백 붙여넣기 (선택)</summary>
      <p class="hint">평가 화면의 피드백 글을 그대로 붙여넣으세요. 이름은 지우고, 개념별 상태만 저장합니다. 피드백 원문은 저장하지 않습니다.</p>
      <textarea id="feedback" rows="6"></textarea>
      <button id="profile-btn" type="button">피드백 분석</button>
    </details>
    <div id="statuses" class="statuses"></div>
    <fieldset class="consent">
      <legend>녹음 동의</legend>
      <label><input type="checkbox" id="consent-a"> 평가자가 동의합니다</label>
      <label><input type="checkbox" id="consent-b"> 피평가자가 동의합니다</label>
      <p class="hint">평가 내내 듣고, 받아 적은 뒤 녹음은 바로 지웁니다. 평가가 끝나면 다룬 개념만 기록합니다.</p>
    </fieldset>
    <button id="start-btn" type="button" disabled>평가 시작</button>
  </section>

  <main id="session" hidden>
    <section class="talk panel">
      <div class="talk-head">
        <h2>대화</h2>
        <span id="rec" class="rec" hidden>● 듣는 중</span>
      </div>
      <ol id="transcript"></ol>
      <form id="manual" class="manual">
        <input id="manual-text" type="text" placeholder="대화를 글로 입력 (STT가 없을 때)">
        <button type="submit">보내기</button>
      </form>
      <button id="end-btn" type="button" class="secondary">평가 끝내기</button>
    </section>

    <section class="viz panel">
      <div id="viz-empty" class="empty">대화에 맞는 시각화가 오른쪽에 추천 카드로 쌓입니다. 원할 때 눌러 펼치세요.</div>
      <div id="viz-host" hidden>
        <div class="viz-head">
          <h2 id="viz-title"></h2>
          <span id="viz-reason" class="reason"></span>
          <button id="viz-refresh" type="button" class="secondary" hidden>대화의 새 값으로 다시 열기</button>
        </div>
        <div id="viz-body"></div>
        <p id="viz-question" class="question"></p>
      </div>
    </section>

    <aside class="cards panel">
      <h2>추천</h2>
      <ol id="cards"></ol>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
