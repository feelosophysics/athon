<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>두 학습자 비교</title>
  <link rel="stylesheet" href="style.css">
  <script src="pyapi.js"></script>
</head>
<body>
  <header>
    <h1>같은 대화, 두 학습자</h1>
    <a href="./" class="nav">평가 화면으로</a>
  </header>

  <section class="compare-setup">
    <div class="panel learner" data-side="a">
      <h2>학습자 A</h2>
      <textarea rows="4">해시 충돌을 체이닝으로 설명할 때 헷갈려서 한참 헤맸습니다.
LRU는 처음 들어 봤어요.</textarea>
      <div class="statuses"></div>
    </div>
    <div class="panel learner" data-side="b">
      <h2>학습자 B</h2>
      <textarea rows="4">해시표 충돌과 체이닝은 이미 잘 알고 막힘없이 설명했습니다.
LRU 캐시 교체 순서가 헷갈렸어요.</textarea>
      <div class="statuses"></div>
    </div>
  </section>
  <p class="hint compare-hint">위 글은 지난 동료 평가 피드백입니다. 바꾸면 다시 분석합니다. 이 화면은 아무것도 저장하지 않습니다.</p>

  <section class="panel talk-bar">
    <form id="say" class="manual">
      <input id="say-text" type="text" placeholder="두 사람에게 같은 대화를 넣습니다">
      <button type="submit">보내기</button>
    </form>
    <div class="script">
      <span class="hint">대본:</span>
      <button type="button" class="secondary" data-line="해시 테이블에 삼이랑 십삼 넣으면 같은 칸이잖아">① 해시 충돌</button>
      <button type="button" class="secondary" data-line="LRU 캐시는 해시맵이랑 연결 리스트로 만든다며?">② LRU는 해시맵으로</button>
      <button type="button" class="secondary" data-line="LRU 캐시 용량 3에 A, B, C 넣고 A 조회하고 D 넣으면?">③ LRU 교체</button>
      <button type="button" class="secondary" id="reset">처음부터</button>
    </div>
    <ol id="talk-log" class="talk-log"></ol>
  </section>

  <p id="diff" class="diff" hidden></p>

  <section class="compare-cols">
    <div class="panel side" data-side="a">
      <h2>학습자 A에게 추천</h2>
      <ol class="rank"></ol>
      <div class="viz-title"></div>
      <div class="viz-body"></div>
    </div>
    <div class="panel side" data-side="b">
      <h2>학습자 B에게 추천</h2>
      <ol class="rank"></ol>
      <div class="viz-title"></div>
      <div class="viz-body"></div>
    </div>
  </section>

  <script type="module" src="compare.js"></script>
</body>
</html>
